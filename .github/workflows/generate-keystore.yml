name: Generate Persistent Keystore (Run Once)

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate upload keystore
        run: |
          keytool -genkey -v \
            -keystore ricchary-upload.keystore \
            -alias ricchary \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=RICCHARY,OU=Dev,O=Ricchary,L=Guayaquil,ST=Guayas,C=EC" \
            -storepass "RiccharyRelease2024" \
            -keypass "RiccharyRelease2024" \
            -noprompt

      - name: "=== PASO 1: Copia esto como secret KEYSTORE_BASE64 ==="
        run: |
          echo "---------- KEYSTORE_BASE64 ----------"
          base64 -w 0 ricchary-upload.keystore
          echo ""
          echo "--------------------------------------"

      - name: "=== PASO 2: Guarda este SHA-256 para assetlinks.json ==="
        run: |
          echo "---------- SHA-256 FINGERPRINT ----------"
          keytool -list -v \
            -keystore ricchary-upload.keystore \
            -alias ricchary \
            -storepass "RiccharyRelease2024" \
            2>/dev/null | grep "SHA256:"
          echo "-----------------------------------------"
          echo ""
          echo "NOTA: Si activas Play App Signing en Play Console,"
          echo "usa el SHA-256 que te da Google ahi, no este."

      - name: "=== PASO 3: Secrets a crear en GitHub ==="
        run: |
          echo "Crea estos 4 secrets en GitHub > Settings > Secrets > Actions:"
          echo ""
          echo "  KEYSTORE_BASE64   = (el base64 del PASO 1)"
          echo "  KEYSTORE_PASSWORD = RiccharyRelease2024"
          echo "  KEY_ALIAS         = ricchary"
          echo "  KEY_PASSWORD      = RiccharyRelease2024"
