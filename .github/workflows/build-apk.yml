name: Build RICCHARY APK + AAB

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASSWORD || 'android123' }}
      KEY_ALIAS_VAL: ${{ secrets.KEY_ALIAS || 'ricchary' }}
      KEY_PASS: ${{ secrets.KEY_PASSWORD || 'android123' }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Accept Android licenses and install components
        run: |
          yes |       rm -rf $ANDROID_HOME/platforms/android-35 || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;34.0.0"

      - name: Install Gradle 8.7
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt/gradle
          echo "/opt/gradle/gradle-8.7/bin" >> $GITHUB_PATH

      - name: Download app icon
        run: |
          curl -sL https://richardpeluche.github.io/ricchary/icon-512.png -o /tmp/icon.png
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p android/app/src/main/res/mipmap-$density
            cp /tmp/icon.png android/app/src/main/res/mipmap-$density/ic_launcher.png
          done

      - name: Prepare keystore
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Usando keystore persistente desde secret"
            echo "$KEYSTORE_BASE64" | base64 -d > android.keystore
          else
            echo "ADVERTENCIA: Sin KEYSTORE_BASE64 - generando keystore temporal"
            keytool -genkey -v -keystore android.keystore \
              -alias "$KEY_ALIAS_VAL" -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=RICCHARY,OU=Dev,O=Ricchary,L=EC,C=EC" \
              -storepass "$KEYSTORE_PASS" -keypass "$KEY_PASS" -noprompt
          fi
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Configure SDK path
        run: echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Generate Gradle wrapper
        run: |
          cd android
          gradle wrapper --gradle-version 7.6.3
          chmod +x gradlew

      - name: Build APK (para pruebas directas)
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="${GITHUB_WORKSPACE}/android.keystore" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASS" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS_VAL" \
            -Pandroid.injected.signing.key.password="$KEY_PASS"

      - name: Build AAB (para Play Store)
        run: |
          cd android
          ./gradlew bundleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="${GITHUB_WORKSPACE}/android.keystore" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASS" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS_VAL" \
            -Pandroid.injected.signing.key.password="$KEY_PASS"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: RICCHARY-APK-v${{ github.run_number }}
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: RICCHARY-AAB-v${{ github.run_number }}
          path: android/app/build/outputs/bundle/release/*.aab
          retention-days: 30

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: RICCHARY v1.0.${{ github.run_number }}
          body: |
            ## RICCHARY v1.0.${{ github.run_number }}
            - **APK**: instalacion directa en Android
            - **AAB**: subida a Google Play Store
          files: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
