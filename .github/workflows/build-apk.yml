name: Build RICCHARY APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Accept Android licenses and install components
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Install Gradle 7.6.3
        run: |
          wget -q https://services.gradle.org/distributions/gradle-7.6.3-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt/gradle
          echo "/opt/gradle/gradle-7.6.3/bin" >> $GITHUB_PATH

      - name: Download app icon
        run: |
          curl -sL https://richardpeluche.github.io/ricchary/icon-512.png -o /tmp/icon.png
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p android/app/src/main/res/mipmap-$density
            cp /tmp/icon.png android/app/src/main/res/mipmap-$density/ic_launcher.png
          done

      - name: Prepare keystore
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android.keystore
          else
            keytool -genkey -v -keystore android.keystore \
              -alias ricchary -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=RICCHARY,OU=Dev,O=Ricchary,L=EC,C=EC" \
              -storepass "android123" -keypass "android123" -noprompt
          fi
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Configure SDK path
        run: echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Generate Gradle wrapper
        run: |
          cd android
          gradle wrapper --gradle-version 7.6.3
          chmod +x gradlew

      - name: Build APK
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="${GITHUB_WORKSPACE}/android.keystore" \
            -Pandroid.injected.signing.store.password="android123" \
            -Pandroid.injected.signing.key.alias="ricchary" \
            -Pandroid.injected.signing.key.password="android123"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: RICCHARY-APK-v${{ github.run_number }}
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: RICCHARY v1.0.${{ github.run_number }}
          files: android/app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
