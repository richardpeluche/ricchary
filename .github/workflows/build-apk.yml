name: Build RICCHARY APK + AAB

# Solo manual: un push a main (p. ej. "Add files via upload") NO compila ni
# publica nada. El AAB/APK quedan como artifacts del run, sin Release publico.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Los secretos de firma NO van aqui a proposito: a nivel de job quedarian
    # expuestos a TODOS los steps. Se declaran solo en los steps que firman.

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Accept Android licenses and install components
        run: |
          rm -rf $ANDROID_HOME/platforms/android-36 || true
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install Gradle 8.11.1
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.11.1-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt/gradle
          echo "/opt/gradle/gradle-8.11.1/bin" >> $GITHUB_PATH

      - name: Prepare keystore
        run: |
          # NO generar keystore temporal como fallback: un AAB firmado con otra
          # llave es rechazado por Play y no tiene arreglo. Mejor fallar aqui.
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASS" ] || [ -z "$KEY_ALIAS_VAL" ] || [ -z "$KEY_PASS" ]; then
            echo "::error::Falta uno o mas secrets de firma (KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD)."
            echo "::error::Build abortado para no generar un AAB con firma incorrecta."
            exit 1
          fi
          echo "Usando keystore persistente desde secret"
          echo "$KEYSTORE_BASE64" | base64 -d > android.keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS_VAL: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}

      - name: Configure SDK path
        run: echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Generate Gradle wrapper
        run: |
          cd android
          gradle wrapper --gradle-version 8.11.1
          chmod +x gradlew

      - name: Build APK (para pruebas directas)
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS_VAL: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="${GITHUB_WORKSPACE}/android.keystore" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASS" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS_VAL" \
            -Pandroid.injected.signing.key.password="$KEY_PASS"

      - name: Build AAB (para Play Store)
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS_VAL: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android
          ./gradlew bundleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="${GITHUB_WORKSPACE}/android.keystore" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASS" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS_VAL" \
            -Pandroid.injected.signing.key.password="$KEY_PASS"

      - name: Verificar el AAB (package, version, SDK, URL de inicio, firma)
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS_VAL: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e
          AAB=$(ls android/app/build/outputs/bundle/release/*.aab | head -1)
          echo "AAB: $AAB"

          # bundletool: unica forma de leer el manifiesto REAL dentro del .aab
          wget -q https://github.com/google/bundletool/releases/download/1.17.2/bundletool-all-1.17.2.jar \
            -O /tmp/bundletool.jar

          dump() { java -jar /tmp/bundletool.jar dump manifest --bundle="$AAB" --xpath="$1" 2>/dev/null; }

          PKG=$(dump "/manifest/@package")
          MSDK=$(dump "/manifest/uses-sdk/@android:minSdkVersion")
          TSDK=$(dump "/manifest/uses-sdk/@android:targetSdkVersion")
          VCODE=$(dump "/manifest/@android:versionCode")
          VNAME=$(dump "/manifest/@android:versionName")
          # DEFAULT_URL apunta a @string/launchUrl: leer el valor compilado en el AAB
          # (--resource usa el formato tipo/nombre, sin el package delante)
          RES_OUT=$(java -jar /tmp/bundletool.jar dump resources --bundle="$AAB" \
            --resource=string/launchUrl --values 2>&1 || true)
          LAUNCH=$(echo "$RES_OUT" | grep -o 'https://[^" ]*' | head -1)
          # Segunda lectura independiente: la tabla de recursos compilada del modulo base
          LAUNCH_PB=$(unzip -p "$AAB" base/resources.pb 2>/dev/null \
            | grep -a -o 'https://richardpeluche\.github\.io/[A-Za-z0-9._/-]*' | sort -u | tr '\n' ' ')
          [ -n "$LAUNCH" ] || { echo "Salida de bundletool dump resources:"; echo "$RES_OUT"; }

          echo "=================================================="
          echo " LEIDO DEL AAB (no del codigo fuente)"
          echo "=================================================="
          echo " package          : $PKG"
          echo " minSdkVersion    : $MSDK"
          echo " targetSdkVersion : $TSDK"
          echo " versionCode      : $VCODE"
          echo " versionName      : $VNAME"
          echo " launchUrl        : $LAUNCH"
          echo " URLs en resources.pb : $LAUNCH_PB"

          # SHA-256 del certificado con el que se firmo realmente el AAB
          mkdir -p /tmp/sig && cd /tmp/sig
          unzip -o -q "$GITHUB_WORKSPACE/$AAB" 'META-INF/*' 2>/dev/null || \
            unzip -o -q "$AAB" 'META-INF/*' 2>/dev/null || true
          CERT=$(ls META-INF/*.RSA META-INF/*.DSA META-INF/*.EC 2>/dev/null | head -1)
          SHA_AAB=$(keytool -printcert -file "$CERT" 2>/dev/null | grep -i "SHA256:" | head -1 | sed 's/.*SHA256: *//')
          cd "$GITHUB_WORKSPACE"

          SHA_KEY=$(keytool -list -v -keystore android.keystore \
            -alias "$KEY_ALIAS_VAL" -storepass "$KEYSTORE_PASS" 2>/dev/null \
            | grep -i "SHA256:" | head -1 | sed 's/.*SHA256: *//')

          echo " SHA-256 (firma del AAB) : $SHA_AAB"
          echo " SHA-256 (keystore)      : $SHA_KEY"
          echo "=================================================="
          echo " Compara el SHA-256 con Play Console >"
          echo " Configuracion > Integridad de la app >"
          echo " Firma de apps > CERTIFICADO DE CLAVE DE SUBIDA"
          echo "=================================================="

          FAIL=0
          [ "$PKG"   = "com.ricchary.cotizaciones" ] || { echo "::error::package=$PKG, se esperaba com.ricchary.cotizaciones."; FAIL=1; }
          [ "$MSDK"  = "21"    ] || { echo "::error::minSdkVersion=$MSDK, se esperaba 21."; FAIL=1; }
          [ "$TSDK"  = "36"    ] || { echo "::error::targetSdkVersion=$TSDK, se esperaba 36. Play lo rechazara."; FAIL=1; }
          [ "$VCODE" = "4"     ] || { echo "::error::versionCode=$VCODE, se esperaba 4."; FAIL=1; }
          [ "$VNAME" = "2.0.0" ] || { echo "::error::versionName=$VNAME, se esperaba 2.0.0."; FAIL=1; }
          [ "$LAUNCH" = "https://richardpeluche.github.io/ricchary-v2/" ] || { echo "::error::launchUrl=$LAUNCH, se esperaba la de ricchary-v2."; FAIL=1; }
          # Una firma vacia (certificado no encontrado) tambien es fallo, no se ignora
          if [ -z "$SHA_AAB" ] || [ "$SHA_AAB" != "$SHA_KEY" ]; then
            echo "::error::La firma del AAB no se pudo leer o NO coincide con el keystore. NO subir a Play."; FAIL=1
          fi
          case "$(echo "$SHA_AAB" | tr 'a-f' 'A-F')" in
            CB:83:F0:E1*) ;;
            *) echo "::error::El certificado del AAB no empieza con CB:83:F0:E1 (clave de carga)."; FAIL=1 ;;
          esac
          exit $FAIL

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: RICCHARY-APK-2.0.0-run${{ github.run_number }}
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: RICCHARY-AAB-2.0.0-run${{ github.run_number }}
          path: android/app/build/outputs/bundle/release/*.aab
          retention-days: 30

      - name: Limpiar keystore del workspace
        if: always()
        run: rm -f android.keystore
